<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c42" />
      <stop offset="50%" stop-color="#ff6b35" />
      <stop offset="100%" stop-color="#e63946" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#primaryGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Film Reel Ring Accent -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="url(#primaryGrad)" stroke-width="6" opacity="0.8" />
  <circle cx="256" cy="240" r="190" fill="none" stroke="#ff6b35" stroke-width="1.5" stroke-dasharray="12 12" opacity="0.5" />

  <!-- Outer Glow Aura -->
  <circle cx="256" cy="240" r="110" fill="#ff6b35" opacity="0.18" filter="url(#glow)" />

  <!-- Inner Cinema Badge -->
  <circle cx="256" cy="240" r="140" fill="#141416" stroke="#27272a" stroke-width="4" />

  <!-- Film strip perforations -->
  <rect x="246" y="74" width="20" height="12" rx="3" fill="#ff6b35" opacity="0.7" />
  <rect x="246" y="394" width="20" height="12" rx="3" fill="#ff6b35" opacity="0.7" />
  <rect x="96" y="230" width="12" height="20" rx="3" fill="#ff6b35" opacity="0.7" />
  <rect x="404" y="230" width="12" height="20" rx="3" fill="#ff6b35" opacity="0.7" />

  <!-- Neon Play Triangle Icon -->
  <polygon points="220,170 330,240 220,310" fill="url(#primaryGrad)" filter="url(#glow)" />
  <polygon points="224,180 320,240 224,300" fill="#ffffff" opacity="0.9" />

  <!-- BMW Cinema Text Banner -->
  <rect x="96" y="415" width="320" height="52" rx="26" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
  <text x="256" y="449" font-family="'Poppins', sans-serif, -apple-system, system-ui" font-size="24" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">
    BMW <tspan fill="#ff6b35">CINEMA</tspan>
  </text>
</svg>
